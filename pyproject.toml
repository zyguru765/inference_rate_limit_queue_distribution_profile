[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zyguru765-inference_rate_limit_queue_distribution_profile"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别成本与容量治理专家·推理服务的限流与排队上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zyguru765" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://zyguru765.github.io"
Repository = "https://github.com/zyguru765/inference_rate_limit_queue_distribution_profile"
Issues = "https://github.com/zyguru765/inference_rate_limit_queue_distribution_profile/issues"

[project.scripts]
inference_rate_limit_queue_distribution_profile = "inference_rate_limit_queue_distribution_profile:main"

[tool.setuptools]
py-modules = ["inference_rate_limit_queue_distribution_profile"]
